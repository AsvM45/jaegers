name: Agent collaboration gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  governance-tests:
    name: Agent governance unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout proposed PR files without writable credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test proposed policy code (no token or secrets)
        run: python -m unittest discover -s tests -p 'test_agent_collaboration_policy.py' -v

  ownership-and-overlap:
    name: Agent ownership and concurrent-PR overlap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout TRUSTED base commit (never PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate claims and concurrent PR overlap using trusted base code
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -f tools/check_agent_pr.py ]; then
            python tools/check_agent_pr.py
          elif [ "$PR_NUMBER" = "23" ] && [ "$PR_HEAD_REF" = "agent/governance-he18-collaboration" ]; then
            echo "BOOTSTRAP EXCEPTION: main does not yet contain the checker."
            echo "This initial policy PR requires human review. Later PRs run trusted checker."
          else
            echo "FAIL: trusted main branch missing agent policy checker"
            exit 1
          fi
