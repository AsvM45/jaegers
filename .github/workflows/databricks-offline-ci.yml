name: Databricks offline CI

on:
  pull_request:
    paths:
      - 'Jaeger_Main/House_Edge/databricks/**'
      - 'tests/test_databricks_*.py'
      - '.github/workflows/databricks-offline-ci.yml'
  push:
    branches: [main]
    paths:
      - 'Jaeger_Main/House_Edge/databricks/**'
      - 'tests/test_databricks_*.py'
      - '.github/workflows/databricks-offline-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: databricks-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Databricks offline synthetic and parity tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without writable credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned runtime and offline-test libraries
        run: |
          python -m pip install --disable-pip-version-check -r Jaeger_Main/House_Edge/requirements-runtime.txt
          python -m pip install --disable-pip-version-check 'pandas>=2.3,<3' 'matplotlib>=3.10,<4'
      - name: Run the complete registered offline Databricks suite
        run: python -m unittest discover -s tests -p 'test_databricks_*.py' -v
      - name: State execution scope
        if: always()
        run: |
          echo 'Offline tests only. This workflow did not authenticate to Databricks, deploy jobs, execute real Spark/Delta compute, or certify MLflow workspace runs.'
