<g font-family="Inter, DejaVu Sans, Arial, sans-serif">
<text x="64" y="75" fill="#e8f4ff" font-size="48" font-weight="830" text-anchor="start" letter-spacing="4">CLAIRVOYANCE</text><text x="68" y="112" fill="#a6bbd0" font-size="23" font-weight="500" text-anchor="start">Hidden-structure forecasting  /  Lakehouse experimentation</text><rect x="1475" y="54" width="260" height="31" rx="15" fill="#51dbff"/><text x="1605.0" y="76" fill="#081326" font-size="14" font-weight="750" text-anchor="middle">JAEGERS · HOUSE EDGE</text><rect x="543" y="144" width="714" height="96" rx="18" fill="#0f2036" stroke="#294563" stroke-width="1.5"/><text x="900" y="179" fill="#e8f4ff" font-size="22" font-weight="800" text-anchor="middle">SOURCE  ·  SIMULATOR DATA</text><text x="900" y="211" fill="#a6bbd0" font-size="18" font-weight="500" text-anchor="middle">train / validation / test  ·  8 machines per episode</text><path d="M 710 240 V 269 H 415 V 301" fill="none" stroke="#51dbff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowcyan)"/><path d="M 1090 240 V 269 H 1372 V 301" fill="none" stroke="#bb9dfb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowviolet)"/><rect x="50" y="294" width="812" height="745" rx="24" fill="#0b1a2e" stroke="#276184" stroke-width="2"/><rect x="938" y="294" width="812" height="745" rx="24" fill="#0c1b30" stroke="#66518e" stroke-width="2"/><rect x="78" y="314" width="255" height="31" rx="15" fill="#51dbff"/><text x="205.5" y="336" fill="#081326" font-size="14" font-weight="750" text-anchor="middle">01  ·  OFFLINE SUBMISSION</text><rect x="966" y="314" width="285" height="31" rx="15" fill="#bb9dfb"/><text x="1108.5" y="336" fill="#081326" font-size="14" font-weight="750" text-anchor="middle">02  ·  DATABRICKS LAKEHOUSE</text><text x="791" y="336" fill="#63e4bd" font-size="16" font-weight="760" text-anchor="end">NO CLOUD AT INFERENCE</text><text x="1676" y="336" fill="#a6bbd0" font-size="16" font-weight="760" text-anchor="end">SEPARATE RESEARCH TRACK</text><rect x="91" y="367" width="729" height="98" rx="16" fill="#11253f" stroke="#294563" stroke-width="1.5"/><rect x="91" y="367" width="6" height="98" rx="3" fill="#51dbff"/><text x="116" y="405" fill="#e8f4ff" font-size="24" font-weight="760" text-anchor="start">As-of input &amp; integrity</text><text x="116" y="437" fill="#a6bbd0" font-size="18" font-weight="400" text-anchor="start">episode_id + machine_id  ·  exact tick &lt; cutoff</text><path d="M454 465 L454 489" fill="none" stroke="#51dbff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowcyan)"/><rect x="91" y="498" width="342" height="126" rx="16" fill="#11253f" stroke="#294563" stroke-width="1.5"/><rect x="91" y="498" width="6" height="126" rx="3" fill="#51dbff"/><text x="116" y="536" fill="#e8f4ff" font-size="21" font-weight="760" text-anchor="start">73 contextual experts</text><text x="116" y="568" fill="#a6bbd0" font-size="17" font-weight="400" text-anchor="start">Bayesian counts + lag patterns</text><text x="116" y="594" fill="#a6bbd0" font-size="17" font-weight="400" text-anchor="start">forgetting + sibling evidence</text><rect x="474" y="498" width="346" height="126" rx="16" fill="#11253f" stroke="#294563" stroke-width="1.5"/><rect x="474" y="498" width="6" height="126" rx="3" fill="#51dbff"/><text x="499" y="536" fill="#e8f4ff" font-size="21" font-weight="760" text-anchor="start">XOR / XNOR posterior</text><text x="499" y="568" fill="#a6bbd0" font-size="17" font-weight="400" text-anchor="start">6 rule hypotheses + null</text><text x="499" y="594" fill="#a6bbd0" font-size="17" font-weight="400" text-anchor="start">learn lag pairs from training</text><path d="M 260 624 V 649 H 383 V 671" fill="none" stroke="#51dbff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowcyan)"/><path d="M 647 624 V 649 H 536 V 671" fill="none" stroke="#51dbff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowcyan)"/><rect x="184" y="672" width="402" height="107" rx="16" fill="#11253f" stroke="#294563" stroke-width="1.5"/><rect x="184" y="672" width="6" height="107" rx="3" fill="#63e4bd"/><text x="209" y="710" fill="#e8f4ff" font-size="21" font-weight="760" text-anchor="start">Gradient-boosted stacker</text><text x="209" y="742" fill="#a6bbd0" font-size="17" font-weight="400" text-anchor="start">Combine expert + structural signals</text><text x="209" y="768" fill="#a6bbd0" font-size="17" font-weight="400" text-anchor="start">predict win probability  π</text><rect x="613" y="672" width="207" height="107" rx="16" fill="#11253f" stroke="#294563" stroke-width="1.5"/><rect x="613" y="672" width="6" height="107" rx="3" fill="#63e4bd"/><text x="638" y="710" fill="#e8f4ff" font-size="21" font-weight="760" text-anchor="start">Payout size</text><text x="638" y="742" fill="#a6bbd0" font-size="17" font-weight="400" text-anchor="start">P(s | win)</text><text x="638" y="768" fill="#a6bbd0" font-size="17" font-weight="400" text-anchor="start">1× / 2× / 5× / 20×</text><path d="M 385 779 V 801 H 456 V 823" fill="none" stroke="#63e4bd" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowteal)"/><path d="M 720 779 V 801 H 456 V 823" fill="none" stroke="#63e4bd" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowteal)"/><rect x="185" y="824" width="576" height="108" rx="16" fill="#11253f" stroke="#294563" stroke-width="1.5"/><rect x="185" y="824" width="6" height="108" rx="3" fill="#63e4bd"/><text x="210" y="862" fill="#e8f4ff" font-size="21" font-weight="760" text-anchor="start">Five-class forecast</text><text x="210" y="894" fill="#a6bbd0" font-size="17" font-weight="400" text-anchor="start">query_id, p_0, p_1, p_2, p_5, p_20</text><text x="210" y="920" fill="#a6bbd0" font-size="17" font-weight="400" text-anchor="start">submission.csv + reproducible code.zip</text><rect x="103" y="972" width="720" height="31" rx="15" fill="#63e4bd"/><text x="463.0" y="994" fill="#081326" font-size="14" font-weight="750" text-anchor="middle">LOCAL CPU · PYTHON 3.13 · SCIKIT-LEARN · NUMPY</text><rect x="974" y="367" width="733" height="99" rx="16" fill="#11253f" stroke="#294563" stroke-width="1.5"/><rect x="974" y="367" width="6" height="99" rx="3" fill="#bb9dfb"/><text x="999" y="405" fill="#e8f4ff" font-size="21" font-weight="760" text-anchor="start">BRONZE  ·  Delta ingestion</text><text x="999" y="437" fill="#a6bbd0" font-size="17" font-weight="400" text-anchor="start">Raw queries / history / labels / conditions</text><text x="999" y="463" fill="#a6bbd0" font-size="17" font-weight="400" text-anchor="start">SHA-256 source-integrity audit</text><path d="M1340 466 L1340 489" fill="none" stroke="#bb9dfb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowviolet)"/><rect x="974" y="498" width="733" height="103" rx="16" fill="#11253f" stroke="#294563" stroke-width="1.5"/><rect x="974" y="498" width="6" height="103" rx="3" fill="#bb9dfb"/><text x="999" y="536" fill="#e8f4ff" font-size="21" font-weight="760" text-anchor="start">SILVER  ·  Validated observations</text><text x="999" y="568" fill="#a6bbd0" font-size="17" font-weight="400" text-anchor="start">Deduplicated spins, episodes, quality checks</text><text x="999" y="594" fill="#a6bbd0" font-size="17" font-weight="400" text-anchor="start">Keep missing ticks unknown</text><path d="M1340 601 L1340 622" fill="none" stroke="#bb9dfb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowviolet)"/><rect x="974" y="631" width="733" height="115" rx="16" fill="#11253f" stroke="#294563" stroke-width="1.5"/><rect x="974" y="631" width="6" height="115" rx="3" fill="#bb9dfb"/><text x="999" y="669" fill="#e8f4ff" font-size="21" font-weight="760" text-anchor="start">GOLD  ·  As-of feature engineering</text><text x="999" y="701" fill="#a6bbd0" font-size="17" font-weight="400" text-anchor="start">471 features across 11 groups  ·  477 total columns</text><text x="999" y="727" fill="#a6bbd0" font-size="17" font-weight="400" text-anchor="start">Strict time filters + reference feature-parity audit</text><path d="M 1340 746 V 764 H 1140 V 781" fill="none" stroke="#bb9dfb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowviolet)"/><path d="M 1340 746 V 764 H 1548 V 781" fill="none" stroke="#bb9dfb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrowviolet)"/><rect x="974" y="782" width="340" height="150" rx="16" fill="#11253f" stroke="#294563" stroke-width="1.5"/><rect x="974" y="782" width="6" height="150" rx="3" fill="#bb9dfb"/><text x="999" y="820" fill="#e8f4ff" font-size="21" font-weight="760" text-anchor="start">MLflow / benchmarks</text><text x="999" y="852" fill="#a6bbd0" font-size="17" font-weight="400" text-anchor="start">Model configs + metrics</text><text x="999" y="878" fill="#a6bbd0" font-size="17" font-weight="400" text-anchor="start">Evaluation provenance</text><text x="999" y="904" fill="#a6bbd0" font-size="17" font-weight="400" text-anchor="start">Artifact and run lineage</text><rect x="1361" y="782" width="346" height="150" rx="16" fill="#11253f" stroke="#294563" stroke-width="1.5"/><rect x="1361" y="782" width="6" height="150" rx="3" fill="#bb9dfb"/><text x="1386" y="820" fill="#e8f4ff" font-size="21" font-weight="760" text-anchor="start">SQL / dashboards</text><text x="1386" y="852" fill="#a6bbd0" font-size="17" font-weight="400" text-anchor="start">DBSQL analytical queries</text><text x="1386" y="878" fill="#a6bbd0" font-size="17" font-weight="400" text-anchor="start">Lakeview 4-page spec</text><text x="1386" y="904" fill="#a6bbd0" font-size="17" font-weight="400" text-anchor="start">Streamlit local dashboard</text><rect x="977" y="972" width="727" height="31" rx="15" fill="#bb9dfb"/><text x="1340.5" y="994" fill="#081326" font-size="14" font-weight="750" text-anchor="middle">SERVERLESS PYSPARK · DELTA · UNITY CATALOG</text><path d="M862 688 L937 688" fill="none" stroke="#a6bbd0" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/><rect x="569" y="1062" width="662" height="64" rx="14" fill="#102a38" stroke="#2b6a78" stroke-width="1.5"/><text x="900" y="1091" fill="#63e4bd" font-size="18" font-weight="720" text-anchor="middle">RESEARCH LINK  ·  parity checks + comparative evidence</text><text x="900" y="1115" fill="#a6bbd0" font-size="15" font-weight="440" text-anchor="middle">Cloud analytics never required by the offline competition entry</text><text x="68" y="1142" fill="#a6bbd0" font-size="14" font-weight="500" text-anchor="start">Architecture states: model and research merged; Databricks PR #90 merged; cloud run claims need independent verification</text></g></svg>