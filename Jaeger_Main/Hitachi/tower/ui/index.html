<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Control-tower page. Fetches /api/events, /api/traces, /api/log, /api/outbox and /api/ontology
     (served by tower/ui/server.py or web/server.js) and renders them. No build step, no libraries. -->
<title>Wacky Wheels Control Tower</title>
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8;--panel:#ffffff;--panel-2:#f3f4f7;--line:#e4e7ec;--line-2:#d6dae1;
  --text:#14171c;--muted:#5c6573;--faint:#8c94a1;
  --accent:#4263eb;--accent-soft:#eef1ff;--accent-line:#c5d0ff;
  --pass:#16884a;--pass-soft:#e6f6ec;--fail:#d6336c;--fail-soft:#fdebf1;--warn:#c27400;--warn-soft:#fff4e0;
  --k-delay:#3b7ddd;--k-outage:#0c8f8f;--k-quality:#c2255c;--k-noise:#8c94a1;--k-rumor:#c27400;
  --t-src:#5b6b8c;--t-part:#3b7ddd;--t-plant:#0c8f8f;--t-po:#2f9e44;--t-co:#e8590c;--t-veh:#c2255c;--t-dealer:#7048e8;--t-cust:#ae3ec9;
  --wire:#c9ced8;--wire-hi:#4263eb;
  --rail:#0f1a45;--c-blue:#2f54eb;--c-orange:#f08c2e;--c-green:#2fb380;--c-red:#e03131;--c-purple:#7048e8;--c-gray:#adb5bd;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px;--shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0e12;--panel:#14171d;--panel-2:#1b1f27;--line:#262b35;--line-2:#323845;
  --text:#e8ebf1;--muted:#9aa3b2;--faint:#687182;
  --accent:#7d95ff;--accent-soft:#1c2340;--accent-line:#34407a;
  --pass:#4fcf8a;--pass-soft:#12291c;--fail:#ff6b9a;--fail-soft:#35131f;--warn:#f2a93b;--warn-soft:#33240e;
  --k-delay:#6ea8ff;--k-outage:#3cc7c7;--k-quality:#ff6b9a;--k-noise:#687182;--k-rumor:#f2a93b;
  --t-src:#8b9bbd;--t-part:#6ea8ff;--t-plant:#3cc7c7;--t-po:#5fd27a;--t-co:#ff9a5c;--t-veh:#ff6b9a;--t-dealer:#a891ff;--t-cust:#d77ef0;
  --wire:#343a47;--wire-hi:#7d95ff;--shadow:none;
  --rail:#080d22;--c-blue:#5c7cfa;--c-orange:#ffa94d;--c-green:#51cf9b;--c-red:#ff6b6b;--c-purple:#9775fa;--c-gray:#5c6370;}}
:root[data-theme="dark"]{
  --bg:#0c0e12;--panel:#14171d;--panel-2:#1b1f27;--line:#262b35;--line-2:#323845;
  --text:#e8ebf1;--muted:#9aa3b2;--faint:#687182;
  --accent:#7d95ff;--accent-soft:#1c2340;--accent-line:#34407a;
  --pass:#4fcf8a;--pass-soft:#12291c;--fail:#ff6b9a;--fail-soft:#35131f;--warn:#f2a93b;--warn-soft:#33240e;
  --k-delay:#6ea8ff;--k-outage:#3cc7c7;--k-quality:#ff6b9a;--k-noise:#687182;--k-rumor:#f2a93b;
  --t-src:#8b9bbd;--t-part:#6ea8ff;--t-plant:#3cc7c7;--t-po:#5fd27a;--t-co:#ff9a5c;--t-veh:#ff6b9a;--t-dealer:#a891ff;--t-cust:#d77ef0;
  --wire:#343a47;--wire-hi:#7d95ff;--shadow:none;
  --rail:#080d22;--c-blue:#5c7cfa;--c-orange:#ffa94d;--c-green:#51cf9b;--c-red:#ff6b6b;--c-purple:#9775fa;--c-gray:#5c6370;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:12.5px}
.app{display:grid;grid-template-columns:320px 1fr;height:100vh}

/* sidebar */
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 6px;display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--t-dealer));display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.brand h1{font-size:14px;margin:0;font-weight:650;letter-spacing:-.01em}
.brand .sub{font-size:12px;color:var(--faint)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 18px}
.kpi{background:var(--panel-2);border-radius:9px;padding:7px 9px}
.kpi .n{font-size:17px;font-weight:700;letter-spacing:-.02em}
.kpi .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.vf{display:flex;gap:4px;padding:2px 18px 10px}
.vf button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 0;font-size:12px;cursor:pointer;color:var(--muted);white-space:nowrap}
.vf button.on{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent);font-weight:600}
.searchbox{margin:0 18px 8px;position:relative}
.searchbox input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);outline:none}
.searchbox input:focus{border-color:var(--accent-line);background:var(--panel)}
.searchbox span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:13px}
.list{overflow:auto;flex:1;padding:4px 10px 16px}
.ev{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:9px 10px;cursor:pointer;margin-bottom:2px}
.ev:hover{background:var(--panel-2)}
.ev.sel{background:var(--accent-soft);border-color:var(--accent-line)}
.ev .r1{display:flex;align-items:center;gap:6px}
.ev .id{font-family:var(--mono);font-size:11.5px;font-weight:600}
.ev .time{margin-left:auto;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.ev .tx{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.ev.sel .tx{color:var(--text)}
.ev .r3{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;align-items:center}
.kb{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.kb::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--k)}
.wc{font-size:10.5px;color:var(--faint);margin-left:auto}
.wc.bad{color:var(--fail);font-weight:600}
.foot{border-top:1px solid var(--line);padding:10px 18px;font-size:11.5px;color:var(--faint);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}

/* main */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.top h2{margin:0;font-size:18px;font-family:var(--mono);letter-spacing:-.02em}
.top .meta{font-size:12.5px;color:var(--faint)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.badge.k{background:var(--panel-2);color:var(--text)}
.badge.k::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--k)}
.badge.acted{background:var(--pass-soft);color:var(--pass)}
.badge.esc{background:var(--warn-soft);color:var(--warn)}
.badge.quiet{background:var(--panel-2);color:var(--muted)}
.badge.failed{background:var(--fail-soft);color:var(--fail)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;height:32px;padding:0 12px;cursor:pointer;color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent-line);color:var(--accent)}
.btn.icon{width:32px;padding:0;justify-content:center}
.tabs{display:flex;gap:4px;padding:0 28px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 12px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.tabs .n{font-size:11px;background:var(--panel-2);border-radius:999px;padding:0 7px;color:var(--muted)}
.content{overflow:auto;flex:1;padding:24px 28px 60px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>h3{margin:0;padding:12px 16px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.card>h3 .c{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint)}
.body{padding:14px 16px}
.msg{font-size:15.5px;line-height:1.65;white-space:pre-wrap;margin:0}
.summary{font-size:14px;line-height:1.6;margin:0}
.guard{display:flex;gap:10px;align-items:flex-start;background:var(--panel-2);border-radius:9px;padding:10px 12px;font-size:13px;color:var(--muted);margin-top:12px}
.guard b{color:var(--text);font-weight:600;white-space:nowrap}
.notice{background:var(--warn-soft);color:var(--text);border-radius:9px;padding:10px 12px;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.stat{background:var(--panel-2);border-radius:10px;padding:10px 12px}
.stat .n{font-size:20px;font-weight:700;letter-spacing:-.02em}
.stat .l{font-size:11.5px;color:var(--muted)}
.stat.alert .n{color:var(--fail)}
.inc{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.inc:last-child{margin-bottom:0}
.inc .h{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.reader{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.reader.rules{background:var(--panel-2);color:var(--muted)}
.kv{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.kv span{font-family:var(--mono);font-size:11.5px;background:var(--panel-2);border-radius:6px;padding:2px 7px}
.kv span i{font-style:normal;color:var(--faint)}
details.evid{margin-top:8px}
details.evid summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-weight:500;list-style:none}
details.evid summary::-webkit-details-marker{display:none}
details.evid summary::before{content:"▸ ";color:var(--faint)}
details.evid[open] summary::before{content:"▾ "}
details.evid ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:12.5px}
details.evid li{margin:2px 0}
.ids{display:flex;flex-wrap:wrap;gap:4px;max-height:8.5rem;overflow:auto;margin:6px 0 0;padding:0;list-style:none}
.ids li{font-family:var(--mono);font-size:11.5px;background:var(--panel-2);border-radius:5px;padding:1px 6px}
.spec{margin-bottom:14px}.spec:last-child{margin-bottom:0}
.spec .h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.cap{text-transform:capitalize}
.spec .h b{margin-left:auto;font-weight:600;color:var(--muted);font-size:12.5px}
.notes{color:var(--muted);font-size:12.5px;margin:6px 0 0}
.empty{color:var(--faint);font-size:13px;margin:0}
.bigempty{padding:44px;text-align:center;color:var(--faint);font-size:13.5px}

/* actions / audit / notifications */
.toolgrp{border-top:1px solid var(--line)}
.toolgrp:first-child{border-top:0}
.toolhead{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;user-select:none}
.toolhead:hover{background:var(--panel-2)}
.toolhead .name{font-family:var(--mono);font-size:12.5px;font-weight:600}
.toolhead .cnt{margin-left:auto;color:var(--muted);font-size:12.5px}
.caret{color:var(--faint);transition:transform .15s;font-size:10px}
.toolgrp.open .caret{transform:rotate(90deg)}
.toolbody{display:none;padding:0 16px 12px;overflow-x:auto}
.toolgrp.open .toolbody{display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:7px 10px;border-bottom:1px solid var(--line)}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap}
.pill.ok,.pill.sent{background:var(--pass-soft);color:var(--pass)}
.pill.no,.pill.failed{background:var(--fail-soft);color:var(--fail)}
.pill.na,.pill.skipped,.pill.unrouted,.pill.dry_run{background:var(--panel-2);color:var(--muted)}
.mut{color:var(--muted)}

/* graph explorer */
.gx{display:grid;grid-template-columns:1fr 270px;min-height:560px}
.gx-main{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
.gx-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.gx-bar .searchbox{margin:0;width:220px}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:3px 9px;min-width:30px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:12.5px}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow);font-weight:600}
.focus-chip{display:flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);border-radius:999px;padding:3px 6px 3px 10px;font-size:12px;font-weight:600}
.focus-chip button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:14px;line-height:1;padding:0 4px}
.hint{font-size:12px;color:var(--faint)}
.gx-canvas{position:relative;overflow:auto;flex:1;max-height:68vh;background:radial-gradient(circle,var(--line) 1px,transparent 1px) 0 0/18px 18px}
.gx-inner{position:relative}
.gx-inner svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.wire{fill:none;stroke:var(--wire);stroke-width:1.3;transition:stroke .12s,opacity .12s}
.wire.hi{stroke:var(--wire-hi);stroke-width:2}
.dimmed .wire:not(.hi){opacity:.18}
.colhead{position:absolute;top:10px;display:flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;white-space:nowrap}
.colhead .cn{color:var(--faint);font-weight:500}
.sw{width:8px;height:8px;border-radius:3px;flex:none;display:inline-block}
.gn{position:absolute;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:0 10px 0 12px;border-radius:9px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;transition:opacity .12s,border-color .12s;overflow:hidden}
.gn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.gn:hover{border-color:var(--c)}
.gn .r1{display:flex;align-items:center;gap:6px;min-width:0}
.gn .nid{font-family:var(--mono);font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gn .nsub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{margin-left:auto;font-size:10px;font-weight:600;padding:0 5px;border-radius:4px;white-space:nowrap;flex:none}
.tg.move,.tg.loaner{background:var(--pass-soft);color:var(--pass)}
.tg.transfer{background:var(--warn-soft);color:var(--warn)}
.tg.notify{background:var(--accent-soft);color:var(--accent)}
.tg.stop{background:var(--fail-soft);color:var(--fail)}
.dimmed .gn:not(.hi){opacity:.28}
.gn.hi{border-color:var(--c)}
.gn.focus{box-shadow:0 0 0 2px var(--c)}
.gmore{position:absolute;border:1px dashed var(--line-2);border-radius:9px;background:var(--panel-2);color:var(--muted);font-size:12px;cursor:pointer;display:grid;place-items:center}
.gmore:hover{border-color:var(--accent-line);color:var(--accent)}
.gx-side{min-width:0;max-height:calc(68vh + 52px);overflow:auto}
.insp{padding:16px}
.insp .ty{display:flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.insp h4{margin:4px 0 2px;font-family:var(--mono);font-size:17px}
.insp .s2{color:var(--muted);font-size:13px;margin-bottom:12px}
.insp .sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;margin:14px 0 6px}
.insp .tags{display:flex;flex-wrap:wrap;gap:4px}
.insp .tags .tg{font-size:11px;padding:2px 7px;border-radius:5px;margin:0}
.legend{display:flex;flex-direction:column;gap:6px}
.legend div{display:flex;align-items:center;gap:8px;font-size:12.5px}
.legend b{margin-left:auto}
.act{border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:6px;font-size:12px}
.act .an{font-family:var(--mono);font-weight:600;font-size:11.5px;display:flex;gap:6px;align-items:center}
.act .ar{color:var(--muted);margin-top:2px}

/* ontology dialog */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--panel);color:var(--text);width:min(640px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,12,16,.45)}
.dlg-h{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h h3{margin:0;font-size:15px}
.dlg-b{padding:16px 18px}
.ocounts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:16px}
.chains{margin:0;padding-left:18px;color:var(--muted);font-size:13px}
.chains li{margin:4px 0}


/* shell + navigation rail */
[hidden]{display:none!important}
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);height:100vh}
.shell>.app,.shell>.page{min-width:0}
.rail{background:var(--rail);color:#c9d1ec;display:flex;flex-direction:column;gap:4px;padding:18px 12px;min-height:0}
.rbrand{display:flex;gap:10px;align-items:center;padding:2px 8px 24px;color:#fff}
.rbrand b{font-size:14px;display:block;letter-spacing:-.01em}.rbrand span{font-size:11.5px;color:#8995c2}
.rail a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:#c9d1ec;text-decoration:none;font-size:13px;font-weight:600;cursor:pointer}
.rail a:hover{background:rgba(255,255,255,.07);color:#fff}
.rail a.on{background:#2f54eb;color:#fff;box-shadow:0 6px 16px rgba(47,84,235,.35)}
.rail a svg{width:18px;height:18px;flex:none}
.rfoot{margin-top:auto;font-size:11.5px;color:#7480ad;padding:8px 10px;line-height:1.5}

/* executive dashboard */
.page{height:100vh;overflow-y:auto;overflow-x:hidden;padding:22px 26px 44px}
.dhead{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.dhead h2{margin:0;font-size:21px;letter-spacing:-.02em}
.dhead .sub{color:var(--faint);font-size:12.5px}
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (min-width:1760px){.kgrid{grid-template-columns:repeat(8,1fr)}}
@media (max-width:1050px){.kgrid{grid-template-columns:repeat(2,1fr)}}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;box-shadow:var(--shadow);min-width:0}
.ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.ic svg{width:19px;height:19px}
.kc .t{font-size:12px;font-weight:600;color:var(--muted)}
.kc .v{font-size:25px;font-weight:700;letter-spacing:-.03em;line-height:1.2;margin-top:2px}
.kcap{font-size:11.5px;color:var(--faint);margin-top:2px}
.kcap.good{color:var(--pass)}.kcap.bad{color:var(--fail)}
.drow{display:grid;gap:16px;margin-bottom:16px}
.drow.r3{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr)}
.drow.r3b{grid-template-columns:minmax(0,.95fr) minmax(0,1.25fr) minmax(0,1.1fr)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.panel>h3{margin:0 0 10px;font-size:15px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.panel>h3 .c{margin-left:auto;font-size:12px;color:var(--faint);font-weight:500}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 8px}
.lg span{display:inline-flex;align-items:center;gap:5px}
.lg i{width:10px;height:10px;border-radius:2px;display:inline-block}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font-family:var(--font);fill:var(--muted);font-size:11px}
svg.chart .gridl{stroke:var(--line);stroke-width:1}
svg.chart .colbar{cursor:pointer}
svg.chart .colbar:hover{opacity:.8}
.donutwrap{display:grid;grid-template-columns:minmax(110px,140px) minmax(0,1fr);gap:10px;align-items:center}
.donutwrap .dtable td,.donutwrap .dtable th{padding:6px 4px;white-space:nowrap}
.dtable{width:100%;border-collapse:collapse;font-size:12.5px}
.dtable th{font-size:11px;padding:6px 8px;white-space:nowrap}
.dtable td{padding:7px 8px}
.dtable td.num,.dtable th.num{text-align:right;font-variant-numeric:tabular-nums}
.dtable tr.click{cursor:pointer}.dtable tr.click:hover td{background:var(--panel-2)}
.dtable tfoot td{font-weight:700;border-top:1px solid var(--line-2)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:1px}
.sharebar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;min-width:60px}
.sharebar i{display:block;height:100%}
.scroll{max-height:330px;overflow:auto}
.scroll thead th{position:sticky;top:0;background:var(--panel)}
.mtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.mt{border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
.mt .l{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt .n{font-size:20px;font-weight:700;letter-spacing:-.02em}
.mapbox{border:1px solid var(--line);border-radius:10px;background:radial-gradient(circle,var(--line) 1px,transparent 1px) 0 0/16px 16px,var(--panel-2)}
.alerts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.al{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:10px;background:var(--panel)}
.al.click{cursor:pointer}.al.click:hover{border-color:var(--accent-line)}
.al .ic{width:30px;height:30px}.al .ic svg{width:16px;height:16px}
.al b{font-size:13px;display:block}
.al p{margin:3px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45}
.al .when{font-size:11.5px;color:var(--faint);margin-top:6px}
@media (max-width:1250px){.drow.r3,.drow.r3b{grid-template-columns:repeat(2,minmax(0,1fr))}.drow.r3>:first-child,.drow.r3b>:last-child{grid-column:1/-1}}

/* ===== blended theme: light SaaS base, glowing "night" graph panels ===== */
:root{--accent:#6d5ef0;--accent-soft:#f1efff;--accent-line:#d9d3ff;--bg:#f6f7fb;
  --c-blue:#6d5ef0;--c-orange:#f4a261;--c-green:#3cc6b8;--c-red:#f06595;--c-purple:#9b8cff;--c-gray:#c3c8d4;--c-sky:#74a7f7;
  --k-delay:#6d5ef0;--k-outage:#3cc6b8;--k-quality:#f06595;--k-noise:#b8bfcc;--k-rumor:#f4a261;--r:16px;
  --shadow:0 1px 2px rgba(20,20,60,.04),0 4px 16px rgba(20,20,60,.05)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#9d92ff;--accent-soft:#221f45;--accent-line:#3d3780;--bg:#0b0d14;
  --c-blue:#8f83ff;--c-orange:#f7b267;--c-green:#4fd1c5;--c-red:#f783ac;--c-purple:#b8aeff;--c-gray:#4b5263;--c-sky:#8fb8ff;
  --k-delay:#8f83ff;--k-outage:#4fd1c5;--k-quality:#f783ac;--k-noise:#5c6370;--k-rumor:#f7b267}}
:root[data-theme="dark"]{--accent:#9d92ff;--accent-soft:#221f45;--accent-line:#3d3780;--bg:#0b0d14;
  --c-blue:#8f83ff;--c-orange:#f7b267;--c-green:#4fd1c5;--c-red:#f783ac;--c-purple:#b8aeff;--c-gray:#4b5263;--c-sky:#8fb8ff;
  --k-delay:#8f83ff;--k-outage:#4fd1c5;--k-quality:#f783ac;--k-noise:#5c6370;--k-rumor:#f7b267}
.rail{background:var(--panel);border-right:1px solid var(--line);color:var(--muted);padding:18px 14px}
.rbrand{color:var(--text);padding:2px 6px 14px}.rbrand span{color:var(--faint)}
.logo{background:linear-gradient(135deg,#6d5ef0,#3cc6b8)}
.rsec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);padding:14px 10px 4px;font-weight:600}
.rail a{color:var(--muted);font-weight:500;padding:9px 10px}
.rail a:hover{background:var(--panel-2);color:var(--text)}
.rail a.on{background:var(--accent-soft);color:var(--accent);box-shadow:none;font-weight:600}
.rail a .rn{margin-left:auto;font-size:11px;background:var(--panel-2);border-radius:999px;padding:0 7px;color:var(--muted)}
.rcard{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;background:var(--panel)}
.rcard:hover{border-color:var(--accent-line)}
.rcard .ic{width:30px;height:30px;border-radius:9px}
.rcard small{display:block;font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.rcard b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;color:var(--text)}
.rfoot{margin-top:8px}
.kc{flex-direction:column;gap:4px;border-radius:14px}
.kh{display:flex;align-items:center;gap:8px}
.kh .ic{width:26px;height:26px;border-radius:8px}.kh .ic svg{width:15px;height:15px}
.kc .v{font-size:26px;margin-top:4px}
.kcap{display:inline-block;align-self:flex-start;background:var(--panel-2);border-radius:6px;padding:1px 7px;margin-top:4px}
.kcap.good{background:var(--pass-soft)}.kcap.bad{background:var(--fail-soft)}
.panel{border-radius:16px;padding:18px 20px}
.btn{border-radius:10px}

/* night panels (graph views) */
.night{position:relative;overflow:hidden;border-radius:16px;border:1px solid #1d2442;color:#dfe5ff;
  background:radial-gradient(900px 420px at 50% 45%,#141c38 0%,#090d1b 58%,#05070e 100%)}
.night h3{color:#eef1ff}.night h3 .c{color:#8a93b8}
.night svg text{fill:#cfd6f5}

/* impact fan-out */
.imp{display:grid;grid-template-columns:1fr 300px;min-height:520px}
.imp-stage{position:relative;overflow:auto;max-height:74vh}
.imp-inner{position:relative}
.imp-inner svg{position:absolute;inset:0;pointer-events:none}
.orb{position:absolute;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle at 40% 35%,#c9c2ff 0%,#7b6cf6 28%,#2b2466 62%,rgba(20,18,50,.0) 72%);box-shadow:0 0 40px rgba(123,108,246,.55),inset 0 0 22px rgba(255,255,255,.25)}
.orb-label{position:absolute;text-align:center;font-weight:700;color:#fff;font-size:14px;line-height:1.3}
.orb-label span{display:block;font-weight:500;font-size:11.5px;color:#b8bff0}
.icard{position:absolute;border-radius:10px;border:1px solid #2a3358;background:linear-gradient(180deg,rgba(32,40,74,.85),rgba(16,21,42,.85));padding:7px 12px;line-height:1.3;cursor:pointer;color:#dfe5ff;transition:border-color .15s,box-shadow .15s}
.icard:hover{border-color:#5b5fb0}
.icard.on{border-color:#d9c58f;box-shadow:0 0 0 1px #d9c58f,0 0 22px rgba(217,197,143,.35)}
.icard .n{font-size:20px;font-weight:700;display:flex;align-items:center;gap:7px}
.icard .n i{width:9px;height:9px;border-radius:50%;display:inline-block}
.icard .l{font-size:11px;color:#9aa3cc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irec{position:absolute;font-size:12px;color:#dfe5ff;cursor:pointer;white-space:nowrap;padding:2px 6px;border-radius:6px}
.irec:hover,.irec.on{background:rgba(125,140,255,.16)}
.irec .id{font-family:var(--mono);font-weight:600;font-size:11.5px}
.irec .sb{color:#8a93b8;font-size:10.5px;margin-left:6px}
.irec .tg{margin-left:6px}
.imp-side{border-left:1px solid #1d2442;background:linear-gradient(180deg,rgba(28,36,66,.55),rgba(12,16,32,.55));backdrop-filter:blur(8px);padding:18px;overflow:auto;max-height:74vh;color:#dfe5ff}
.imp-side .ty{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#8a93b8;font-weight:600;display:flex;align-items:center;gap:6px}
.imp-side h4{margin:6px 0 2px;font-size:20px;font-family:var(--mono);color:#fff}
.imp-side .s2{color:#aeb6d8;font-size:13px;margin-bottom:12px}
.imp-side .sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:#7f89ad;font-weight:600;margin:16px 0 6px}
.imp-side .act{border-color:#2a3358;background:rgba(10,14,28,.4)}.imp-side .act .ar{color:#aeb6d8}
.imp-side .legend div{color:#cfd6f5}
.imp-more{position:absolute;font-size:12px;color:#aeb6d8;background:rgba(125,140,255,.14);border:1px solid #2a3358;border-radius:8px;padding:3px 10px;cursor:pointer}

/* reports */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.rp{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.rp.active{border-color:var(--accent-line);box-shadow:0 0 0 1px var(--accent-line),var(--shadow)}
.rp .rt{display:flex;align-items:center;gap:8px}
.rp .rt b{font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.chip.act{background:var(--accent-soft);color:var(--accent)}
.chip.test{background:color-mix(in srgb,var(--c-green) 16%,transparent);color:var(--c-green)}
.star{border:0;background:none;cursor:pointer;font-size:17px;color:var(--faint);padding:0 2px;line-height:1}
.star.on{color:#f5b301}
.rstats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rstats div{background:var(--panel-2);border-radius:9px;padding:6px 8px}
.rstats b{display:block;font-size:16px;letter-spacing:-.02em}.rstats span{font-size:10.5px;color:var(--muted)}
.mix{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--panel-2)}
.rp .notes{font-size:12.5px;color:var(--muted);white-space:pre-wrap;margin:0}
.rp .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}
.rp .acts .btn{height:30px;font-size:12.5px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{color:#fff;filter:brightness(1.07)}
.rp input[type=text],.rp textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);padding:7px 9px;font:inherit;font-size:13px;color:var(--text);outline:none}
.rp textarea{min-height:64px;resize:vertical}
.cmp{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-left:auto;cursor:pointer}
.cmpt td.diff{font-weight:700;color:var(--accent)}

/* ===== node map ===== */
.gx.night{border-radius:16px}
.nm-canvas{position:relative;flex:1;min-height:560px;height:70vh}
svg.nm{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg.nm.panning{cursor:grabbing}
.nm .orbit{fill:none;stroke:rgba(190,200,255,.09);stroke-dasharray:2 5}
.nm .ringlbl{fill:#6f7aa3;font-family:var(--font);font-weight:600;font-size:calc(9.5px * var(--k,1));letter-spacing:.08em}
.nm .nlink{fill:none;transition:stroke-opacity .15s;vector-effect:non-scaling-stroke}
.nm .orbit{vector-effect:non-scaling-stroke}
.nm .nnode{cursor:pointer}
.nm .nlbl{fill:#cfd6f5;font-family:var(--mono);font-weight:500;font-size:calc(10px * var(--k,1));pointer-events:none;paint-order:stroke;stroke:#070a14;stroke-width:calc(3px * var(--k,1))}
.nm .nlbl.hub{font-family:var(--font);font-weight:600;font-size:calc(12.5px * var(--k,1));fill:#fff}
.nm .ntag{font-family:var(--font);font-weight:600;font-size:calc(9px * var(--k,1))}
.nm .ntag.move,.nm .ntag.loaner{fill:#7cecb0}.nm .ntag.transfer{fill:#ffc078}.nm .ntag.notify{fill:#a5b4ff}.nm .ntag.stop{fill:#ff8fb6}
.nm.dim .nnode:not(.hi){opacity:.12}.nm.dim .nlink:not(.hi){stroke-opacity:.03}.nm.dim .nlink.hi{stroke-opacity:.9;stroke-width:1.4}
.nm.dim .nlbl:not(.hi){opacity:.1}
.nm-legend{position:absolute;left:14px;bottom:14px;background:rgba(10,14,28,.72);border:1px solid #232b4d;border-radius:10px;padding:9px 12px;font-size:11.5px;color:#aeb6d8;display:flex;flex-direction:column;gap:4px;backdrop-filter:blur(6px)}
.nm-legend b{font-size:10.5px;letter-spacing:.08em;color:#7f89ad;font-weight:600}
.nm-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.nm-legend em{font-style:normal;color:#7f89ad;margin-left:4px}
.nm-notes{padding:10px 14px;border-top:1px solid #1d2442;font-size:12px;color:#8a93b8}
.night .gx-main{border-right-color:#1d2442}
.night .gx-bar{border-bottom-color:#1d2442}
.night .searchbox input{background:rgba(255,255,255,.05);border-color:#2a3358;color:#e8ebf1}
.night .searchbox input:focus{background:rgba(255,255,255,.08);border-color:#4b5394}
.night .seg{background:rgba(255,255,255,.05);border-color:#2a3358}
.night .seg button{color:#9aa3cc}.night .seg button.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.night .hint{color:#7f89ad}
.night .focus-chip{background:rgba(157,146,255,.16);border-color:#4b4594;color:#d3ccff}
.night .gx-side{background:linear-gradient(180deg,rgba(28,36,66,.5),rgba(12,16,32,.5));border-left:1px solid #1d2442}
.night .insp .ty,.night .insp .sec{color:#7f89ad}.night .insp h4{color:#fff}.night .insp .s2{color:#aeb6d8}
.night .legend div{color:#cfd6f5}.night .legend b{color:#fff}
.night .act{border-color:#2a3358;background:rgba(10,14,28,.4)}.night .act .an{color:#fff}.night .act .ar{color:#aeb6d8}
.night .empty{color:#8a93b8}

/* ===== theme blend: glow accents on light, glass on dark ===== */
body{background:radial-gradient(1100px 620px at 8% -8%,rgba(109,94,240,.10),transparent 62%),radial-gradient(1000px 640px at 104% 108%,rgba(60,198,184,.10),transparent 60%),var(--bg);background-attachment:fixed}
.app>aside,.top,.tabs{background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(10px)}
.ic{background:linear-gradient(140deg,color-mix(in srgb,var(--c) 26%,transparent),color-mix(in srgb,var(--c) 8%,transparent));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 22%,transparent),0 6px 16px -4px color-mix(in srgb,var(--c) 45%,transparent)}
.rail a.on{background:linear-gradient(90deg,var(--accent-soft),color-mix(in srgb,var(--c-green) 10%,transparent));position:relative}
.rail a.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,#6d5ef0,#3cc6b8)}
.kc,.panel,.card,.rp{position:relative}
.kc::after,.panel::after,.rp::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 7%,transparent),transparent 38%)}
.kc .v{background:linear-gradient(90deg,var(--text),color-mix(in srgb,var(--text) 70%,var(--accent)));-webkit-background-clip:text;background-clip:text;color:transparent}
.night{box-shadow:0 18px 50px -18px rgba(40,30,120,.45),inset 0 0 0 1px rgba(160,150,255,.06)}
.donut-g{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent) 45%,transparent))}
.mapbox{overflow:hidden;border-color:#1d2442;background:radial-gradient(500px 260px at 50% 45%,#141c38,#070a14)}
.mapbox svg text{fill:#dfe5ff !important}
.mapbox circle{filter:drop-shadow(0 0 7px rgba(95,224,210,.55))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{background:radial-gradient(1000px 600px at 12% -10%,rgba(109,94,240,.22),transparent 60%),radial-gradient(900px 620px at 100% 110%,rgba(60,198,184,.14),transparent 60%),#06080f;background-attachment:fixed}
  :root:not([data-theme="light"]) .kc,:root:not([data-theme="light"]) .panel,:root:not([data-theme="light"]) .card:not(.night),:root:not([data-theme="light"]) .rp{background:rgba(20,24,40,.62);backdrop-filter:blur(12px);border-color:rgba(160,170,255,.09)}
  :root:not([data-theme="light"]) .rail{background:rgba(10,13,24,.75)}}
:root[data-theme="dark"] body{background:radial-gradient(1000px 600px at 12% -10%,rgba(109,94,240,.22),transparent 60%),radial-gradient(900px 620px at 100% 110%,rgba(60,198,184,.14),transparent 60%),#06080f;background-attachment:fixed}
:root[data-theme="dark"] .kc,:root[data-theme="dark"] .panel,:root[data-theme="dark"] .card:not(.night),:root[data-theme="dark"] .rp{background:rgba(20,24,40,.62);backdrop-filter:blur(12px);border-color:rgba(160,170,255,.09)}
:root[data-theme="dark"] .rail{background:rgba(10,13,24,.75)}

/* ===== reports trash ===== */
.btn.danger:hover{border-color:var(--fail);color:var(--fail)}
.btn.dangerfill{background:var(--fail);border-color:var(--fail);color:#fff}
.trash{margin-top:22px}
.trash .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.trash .row:first-of-type{border-top:0}

/* ===== test case walkthrough ===== */
.vp{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--panel-2);color:var(--muted);letter-spacing:.03em}
.vp.pass{background:var(--pass-soft);color:var(--pass)}.vp.fail{background:var(--fail-soft);color:var(--fail)}
.tcbanner{display:flex;align-items:center;gap:14px;border-radius:16px;padding:16px 20px;border:1px solid var(--line);flex-wrap:wrap}
.tcbanner.pass{background:linear-gradient(100deg,var(--pass-soft),color-mix(in srgb,var(--pass-soft) 30%,var(--panel)));border-color:color-mix(in srgb,var(--pass) 30%,transparent)}
.tcbanner.fail{background:linear-gradient(100deg,var(--fail-soft),color-mix(in srgb,var(--fail-soft) 30%,var(--panel)));border-color:color-mix(in srgb,var(--fail) 30%,transparent)}
.tcv{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:700;color:#fff;flex:none}
.tcbanner.pass .tcv{background:var(--pass);box-shadow:0 0 20px color-mix(in srgb,var(--pass) 50%,transparent)}
.tcbanner.fail .tcv{background:var(--fail);box-shadow:0 0 20px color-mix(in srgb,var(--fail) 50%,transparent)}
.tct{font-size:19px;font-weight:700;letter-spacing:-.02em}
.tcs{font-size:12.5px;color:var(--muted)}
.btn[disabled]{opacity:.4;pointer-events:none}
.tcmsg{background:var(--panel-2);border-radius:10px;padding:12px 14px;font-size:14.5px;line-height:1.6;white-space:pre-wrap}
.tci{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}

/* ===== knowledge graph (dashboard) ===== */
.kgwrap{margin-bottom:16px;background:radial-gradient(900px 520px at 22% 50%,#132a30 0%,#0a1418 50%,#05080b 100%);border-color:#17282d}
.kg{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:640px}
.kg-stage{overflow:auto;padding:10px 0}
.kg-inner{position:relative;margin:0 auto}
.kg-halo{position:absolute;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(60,90,110,.35) 0%,rgba(20,40,50,.25) 45%,transparent 70%);border:1px solid rgba(180,200,220,.06)}
.kg-ring{position:absolute;width:156px;height:156px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(170,160,255,.75) 0 1.2deg,transparent 1.2deg 4deg);
  -webkit-mask:radial-gradient(circle,transparent 60%,#000 62%,#000 72%,transparent 74%);mask:radial-gradient(circle,transparent 60%,#000 62%,#000 72%,transparent 74%);animation:kgspin 40s linear infinite;filter:drop-shadow(0 0 6px rgba(150,140,255,.6))}

.kg-orb{cursor:pointer;background:radial-gradient(circle at 40% 35%,#efe9ff 0%,#a99cf7 25%,#4b3fa8 58%,#120f2c 72%)}
.kgc .n em{font-style:normal;font-size:11px;color:#8a93b8;font-weight:500;margin-left:4px}

.kg-side{margin:14px 14px 14px 0;border-radius:22px;padding:20px 20px 16px;color:#e6ecf2;background:linear-gradient(180deg,rgba(38,62,68,.62),rgba(12,22,26,.75));border:1px solid rgba(160,200,210,.12);backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:12px}
.kgs-k{font-size:12px;color:#c9d7dc;display:flex;align-items:center;gap:6px;font-weight:500}
.kgs-t{font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.25}.kgs-t span{font-size:13px;color:#9fb2b8;font-weight:400}
.kgs-box{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px solid rgba(160,200,210,.14);border-radius:12px;padding:10px 12px;background:rgba(0,0,0,.18)}
.kgs-up{font-size:12px;color:#9fb2b8;margin-top:6px}
.kgs-chip{font-size:11px;font-weight:600;border-radius:6px;padding:1px 8px;background:rgba(95,224,180,.14);color:#8ef0c4;border:1px solid rgba(95,224,180,.3)}
.kgs-chip.ghost{background:rgba(255,255,255,.05);color:#b7c6cc;border-color:rgba(255,255,255,.12)}
.kgs-btn{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#e6ecf2;border-radius:10px;padding:7px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.kgs-btn:hover{background:rgba(255,255,255,.12)}
.kgs-big{border-radius:14px;padding:14px;background:linear-gradient(180deg,rgba(60,24,30,.0),rgba(0,0,0,.25));border:1px solid rgba(255,255,255,.07)}
.kgs-bt{display:flex;align-items:center;justify-content:space-between;font-size:14px}
.kgs-bn{font-size:40px;font-weight:300;letter-spacing:-.03em;margin:4px 0 8px}

.kgnetw{display:flex;flex-direction:column;min-height:720px;color:#e6ecf2}

.kgsel-id{font-family:var(--mono);font-size:18px;font-weight:600;margin-top:4px}.kgsel-sub{font-size:12px;color:#9fb2b8}

.kgsel-ev{display:flex;flex-wrap:wrap;gap:4px}.kgsel-ev button{font-size:11px;font-family:var(--mono);border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#e6ecf2;border-radius:6px;padding:2px 7px;cursor:pointer}
.kgchart{border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}

.kgseg{margin-left:auto;display:flex;gap:2px}.kgseg button{border:0;background:none;color:#8aa0a8;font-size:11px;padding:2px 6px;border-radius:5px;cursor:pointer}.kgseg button.on{background:rgba(255,255,255,.1);color:#fff}
.kgrow{display:grid;grid-template-columns:22px minmax(0,1fr) 48px 44px;gap:6px;align-items:center;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.05);font-size:12.5px;cursor:pointer}

.kgrow:not(.kgh):hover,.kgrow.on{background:rgba(127,214,230,.08)}

.kgrow span:nth-child(2) i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}

.kgrow span:nth-child(3),.kgrow span:nth-child(4){text-align:right}.kgrow .up{color:#8ef0c4}
.kgtl{display:flex;align-items:center;gap:8px;padding:8px 14px 12px;border-top:1px solid rgba(160,200,210,.1)}
.kgtl svg{flex:1;height:60px}
.kgnav{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:#e6ecf2;cursor:pointer;flex:none}
.kgaxis{stroke:rgba(160,200,210,.25)}
.kgtick{cursor:pointer}.kgtick line{stroke:rgba(160,200,210,.35)}.kgtick circle{fill:#5fe0d2;opacity:.7}.kgtick text{fill:#8aa0a8;font:10px var(--mono)}
.kgtick.on circle{fill:#e9d9a6;opacity:1;filter:drop-shadow(0 0 5px #e9d9a6)}.kgtick.on text{fill:#fff}
@media (max-width:1250px){.kg{grid-template-columns:1fr}.kg-side{margin:0 14px 14px}.kgnet-body{grid-template-columns:180px minmax(0,1fr)}.kgr{grid-column:1/-1;border-left:0;max-height:none}}

/* ===== 3D knowledge network ===== */
.kg3d{position:relative;width:100%;height:100%;min-height:600px;overflow:hidden;background:#04080a}
.kg3d canvas{display:block;width:100%!important;height:100%!important;cursor:grab}

.kg3d-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.kg3d-l{position:absolute;left:0;top:0;font:500 10.5px var(--font);color:#d7e6ec;white-space:nowrap;text-shadow:0 0 6px #000,0 0 2px #000;will-change:transform}
.kg3d-l.big{font-size:13px;font-weight:600;color:#fff}
.kg3d-tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;background:rgba(8,14,18,.9);border:1px solid rgba(127,214,230,.3);border-radius:8px;padding:6px 9px;font-size:12px;color:#e6ecf2;backdrop-filter:blur(6px);white-space:nowrap}
.kg3d-tip span{color:#8aa0a8;font-size:11px}
.kg3d-hint{position:absolute;right:12px;bottom:10px;font-size:11px;color:#6f8a92;pointer-events:none}
.kg3dseg{margin-left:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:2px}

@media (max-width:1100px){.gx{grid-template-columns:1fr}.gx-main{border-right:0;border-bottom:1px solid var(--line)}.gx-side{max-height:none}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr;height:auto}
  .rail{flex-direction:row;overflow-x:auto;padding:8px;gap:6px}.rbrand,.rfoot{display:none}
  .page{height:auto;padding:16px}
  .drow.r3,.drow.r3b{grid-template-columns:1fr}.donutwrap{grid-template-columns:1fr}
  .rsec,.rcard{display:none}.imp{grid-template-columns:1fr}.imp-side{border-left:0;border-top:1px solid #1d2442}
  .mtiles{grid-template-columns:1fr 1fr}
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100vh}
  aside{border-right:0;border-bottom:1px solid var(--line);max-height:46vh}
  .top,.tabs{padding-left:16px;padding-right:16px}.content{padding:16px}
  .grid2{grid-template-columns:1fr}
}

<script>
(function () {
  "use strict";
  var store = {get:function(k,d){try{var v=localStorage.getItem("ct."+k);return v==null?d:v}catch(e){return d}},set:function(k,v){try{localStorage.setItem("ct."+k,v)}catch(e){}}};
  var TABS = ["testcase","overview","impact","graph","actions","notifications","audit"];
  var state = { events:[], traces:new Map(), log:[], outbox:[], ontology:null, selected:null, feedError:"",
    tab: TABS.indexOf(store.get("tab","overview"))>=0 ? store.get("tab","overview") : "overview",
    filter:"all", q:"", focus:null, expanded:{}, gq:"", zoom:null, scale:1, view:"dashboard",
    run: null, reports: null, cases: null, kg: null, kgLay: null, kgView: "fan", kg3d: true, kg3dFail: false, kgCam: null, kgCamTouched: false, kgLay3: null, kgCat: null, kgSel: null, kgEvent: null, kgRank: "all", rfilter:"all", rq:"", compare:{}, editing:null, impCat:null, impSel:null, impAll:false };
  var loadGeneration = 0, graphCache = new Map();
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); };

  var KIND = {supplier_delay:["Supplier delay","--k-delay"],plant_outage:["Plant outage","--k-outage"],quality_hold:["Quality hold","--k-quality"],
              noise:["Noise","--k-noise"],unconfirmed:["Unconfirmed","--k-rumor"]};
  var WRITES = {"mes.reschedule":1,"mes.transfer":1,"dealer.notify":1,"dealer.stop_sale":1,"crm.assign_loaner":1,"crm.notify_customer":1,"quality.hold_lot":1};
  var TOOL_LABEL = {"mes.reschedule":"Rescheduled","mes.transfer":"Transferred","dealer.notify":"Dealers notified","crm.assign_loaner":"Loaners",
                    "dealer.stop_sale":"Stop-sales","crm.notify_customer":"Customers contacted","quality.hold_lot":"Lots held","escalate":"Escalations"};

  /* ---------- data ---------- */
  function getJson(url) { return fetch(url, {cache:"no-store"}).then(function (r) { if (!r.ok) throw new Error(url + " returned " + r.status); return r.json(); }); }
  function asList(p) { return Array.isArray(p) ? p : (p && typeof p === "object" ? Object.values(p) : []); }
  function clock(iso) { var m = String(iso || "").match(/T(\d{2}:\d{2})/); return m ? m[1] : String(iso || ""); }
  function fmt(v) { return v == null ? "" : (typeof v === "object" ? JSON.stringify(v) : String(v)); }
  function traceFor(id) { return state.traces.get(id) || null; }
  function logFor(id) { return state.log.filter(function (l) { return l && l.event_id === id; }); }
  function callsFor(trace) {
    if (!trace) return [];
    if (Array.isArray(trace.calls) && trace.calls.length) return trace.calls;
    var out = []; (trace.results || []).forEach(function (r) { (r.calls || []).forEach(function (c) { out.push(c); }); }); return out;
  }
  function okOf(line) {
    if (!line || !Object.prototype.hasOwnProperty.call(line, "ok")) return null;
    var ok = line.ok; if (ok === true || ok === "ok" || ok === "true") return true; if (ok === false || ok === "fail" || ok === "false") return false; return null;
  }
  // Calls paired with the matching audit line (same order the coordinator executed them).
  function pairedCalls(id) {
    var lines = logFor(id), calls = callsFor(traceFor(id));
    if (!calls.length) return lines.map(function (l) { return {tool:l.tool, args:l.args, reason:"", ok:okOf(l), error:l.error}; });
    return calls.map(function (c, i) { var l = lines[i]; return {tool:c.tool, args:c.args, reason:c.reason || "", ok: l ? okOf(l) : null, error: l && l.error}; });
  }
  function kindsOf(trace) {
    if (!trace) return [];
    if (Array.isArray(trace.incidents) && trace.incidents.length) return trace.incidents.map(function (i) { return i.kind; });
    return String(trace.classification || "").split("+").filter(Boolean);
  }
  function statusOf(id) {
    var trace = traceFor(id); if (!trace) return "pending";
    var calls = pairedCalls(id);
    if (calls.some(function (c) { return c.ok === false; })) return "failed";
    if (calls.some(function (c) { return WRITES[c.tool] && c.ok !== false; })) return "acted";
    if (calls.some(function (c) { return c.tool === "escalate"; })) return "escalated";
    return "quiet";
  }
  var STATUS = {acted:["Acted","acted"],escalated:["Escalated","esc"],quiet:["No action","quiet"],failed:["Failed calls","failed"],pending:["Not run","quiet"]};

  function load(keepId) {
    var gen = ++loadGeneration;
    getJson("/api/events" + runQ()).then(function (events) {
      if (gen !== loadGeneration) return null;
      state.events = Array.isArray(events) ? events : []; state.feedError = "";

    return '<span class="vp ' + (v === "PASS" ? "pass" : v === "FAIL" ? "fail" : "") + '">' + esc(v) + '</span>';
  }
  function caseOrder() { return state.events.map(function (e) { return e.event_id; }).filter(function (id) { return state.cases && state.cases.has(id); }); }
  function testcaseTab(id) {
    var c = state.cases && state.cases.get(id);
    if (!c) { $("content").innerHTML = '<div class="wrap"><div class="card"><div class="bigempty">This event is not one of the generated test cases.</div></div></div>'; return; }
    var r = c.result || {}, v = r.verdict || "NOT RUN", order = caseOrder(), k = order.indexOf(id);
    var t = traceFor(id), calls = pairedCalls(id), escalated = calls.some(function (x) { return x.tool === "escalate"; });
    var got = ((t && t.incidents) || []).filter(function (i) { return REAL[i.kind]; });
    var want = (c.expect && c.expect.incidents) || [];
    var passed = order.filter(function (x) { var y = state.cases.get(x); return y.result && y.result.verdict === "PASS"; }).length;

    var html = '<div class="wrap">';
    html += '<div class="tcbanner ' + (v === "PASS" ? "pass" : "fail") + '"><div class="tcv">' + (v === "PASS" ? "✓" : "✕") + '</div><div style="min-width:0"><div class="tct">' + esc(c.id) + ' ' + (v === "PASS" ? "passed" : v === "FAIL" ? "failed" : "was not run") + '</div>' +
      '<div class="tcs">' + esc(CASE_CAT[c.category] || c.category) + (c.edge ? ' · edge case' : '') + ' · case ' + (k + 1) + ' of ' + order.length + ' · ' + passed + '/' + order.length + ' passing in this report</div></div><span class="spacer"></span>' +
      '<button class="btn" id="tcPrev"' + (k <= 0 ? " disabled" : "") + '>← Previous</button><button class="btn primary" id="tcNext"' + (k >= order.length - 1 ? " disabled" : "") + '>Next case →</button></div>';

    html += '<div class="card"><h3>What this case tests<span class="c">' + esc(CASE_CAT[c.category] || c.category) + '</span></h3><div class="body"><p class="summary" style="margin-bottom:12px">' + esc(CASE_WHY[c.category] || "") + '</p>' +
      '<div class="tcmsg"><div class="mut" style="font-size:11.5px;margin-bottom:4px">Message · ' + esc(c.source) + '</div>' + esc(c.text) + '</div>' +
      (c.edge ? '<div class="edgebox"><b>Edge case.</b> ' + esc(c.edge) + '</div>' : '') + '</div></div>';

    // predicted vs actual, side by side
    var predicted = want.length ? want.map(function (w) {
      var d = KIND[w.kind] || [w.kind, "--k-noise"];
      return '<div class="tci"><span class="badge k" style="--k:var(' + d[1] + ')">' + esc(d[0]) + '</span><dl>' + Object.keys(w).filter(function (f) { return f !== "kind"; }).map(function (f) {
        return '<dt>' + esc(FIELD_LABEL[f] || f) + '</dt><dd class="mono">' + esc(Array.isArray(w[f]) ? w[f].join(", ") : w[f]) + '</dd>'; }).join("") + '</dl></div>';
    }).join("") : '<p class="summary">No operational incident. ' + (c.expect.escalate ? "The tower should <b>escalate</b> and write nothing." : "The tower should <b>do nothing</b>.") + '</p>';
    var actual = got.length ? got.map(function (g) {
      var d = KIND[g.kind] || [g.kind, "--k-noise"], fields = Object.keys(FIELD_LABEL).filter(function (f) { return g[f]; });
      return '<div class="tci"><span class="badge k" style="--k:var(' + d[1] + ')">' + esc(d[0]) + '</span>' + (g.reader ? ' <span class="reader ' + (g.reader === "rules" ? "rules" : "") + '">' + esc(g.reader) + '</span>' : '') +
        '<dl>' + fields.map(function (f) { return '<dt>' + esc(FIELD_LABEL[f]) + '</dt><dd class="mono">' + esc(g[f]) + '</dd>'; }).join("") + '</dl></div>';
    }).join("") : '<p class="summary">Read as <span class="mono">' + esc(t ? t.classification : "—") + '</span>. ' + (escalated ? "The tower <b>escalated</b>" : "The tower did <b>not escalate</b>") + ' and made ' + (r.stats ? r.stats.writes : 0) + ' writes.</p>';
    html += '<div class="grid2"><div class="card"><h3>Predicted outcome<span class="c">from tests/cases.json</span></h3><div class="body">' + predicted +
      '<div class="tcesc">Escalate: <b>' + (c.expect.escalate ? "yes" : "no") + '</b></div></div></div>' +
      '<div class="card"><h3>Actual outcome<span class="c">what the tower did</span></h3><div class="body">' + actual +
      '<div class="tcesc">Escalated: <b style="color:' + (escalated === !!c.expect.escalate ? "var(--pass)" : "var(--fail)") + '">' + (escalated ? "yes" : "no") + '</b></div>' +
      (r.stats ? '<div class="stats" style="margin-top:12px">' + tcStats(r.stats) + '</div>' : '') + '</div></div></div>';

    // field-by-field check
    var rows = "";
    want.forEach(function (w) {
      var g = got.filter(function (x) { return x.kind === w.kind; })[0] || {}, d = KIND[w.kind] || [w.kind];
      rows += '<tr class="sect"><td colspan="4">' + esc(d[0]) + (g.kind ? "" : ' <span style="color:var(--fail)">— not detected</span>') + '</td></tr>';
      if (w.kind === "quality_hold") {
        var held = calls.filter(function (x) { return x.tool === "quality.hold_lot" && x.ok !== false; }).map(function (x) { return x.args.lot_id; }).sort();
        var ok = JSON.stringify(held) === JSON.stringify(w.lots.slice().sort());
        rows += tcRow("Lots held", w.lots.join(", "), held.join(", ") || "—", ok);
      } else Object.keys(w).filter(function (f) { return f !== "kind"; }).forEach(function (f) { rows += tcRow(FIELD_LABEL[f] || f, w[f], g[f] == null ? "—" : g[f], g[f] === w[f]); });
    });
    if (!want.length) rows += tcRow("Operational incidents", "none", got.length ? got.map(function (x) { return (KIND[x.kind] || [x.kind])[0]; }).join(", ") : "none", !got.length);
    rows += tcRow("Escalate", c.expect.escalate ? "yes" : "no", escalated ? "yes" : "no", escalated === !!c.expect.escalate);
    if (r.stats && "expected_moves" in r.stats) rows += tcRow("Production orders moved", r.stats.expected_moves, r.stats.moved, r.stats.moved === r.stats.expected_moves);
    html += '<div class="card"><h3>Field-by-field check</h3><div class="body" style="padding:4px 6px"><table class="dtable tcheck"><thead><tr><th>Check</th><th>Predicted</th><th>Actual</th><th style="width:40px"></th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';

    // grader findings
    var fails = r.fails || [], warns = r.warnings || [];
    html += '<div class="card"><h3>Grader findings<span class="c">' + fails.length + ' fail · ' + warns.length + ' warn</span></h3><div class="body">' +
      (fails.length || warns.length ? '<div class="issues">' + fails.map(function (f) { return '<div class="issue f"><span class="k">FAIL</span><span>' + esc(f) + '</span></div>'; }).join("") +
        warns.map(function (f) { return '<div class="issue w"><span class="k">WARN</span><span>' + esc(f) + '</span></div>'; }).join("") + '</div>' : '<div class="okline">✓ Every check passed</div>') +
      (t && t.summary ? '<div class="guard" style="margin-top:12px"><b>Tower summary</b><span>' + esc(t.summary) + '</span></div>' : '') + '</div></div>';

    // knowledge graph
    var g = graphFor(id);
    html += '<div style="display:flex;align-items:baseline;gap:8px;margin-top:4px"><h3 style="margin:0;font-size:15px">Knowledge graph</h3><span class="mut" style="font-size:12.5px">every record the tower traced for this case · ' + g.nodes.length + ' nodes</span></div>';
    html += g.nodes.length ? graphCard(g) : '<div class="night"><div class="bigempty" style="color:#aeb6d8;padding:50px">No knowledge-graph path — nothing operational to trace' + (want.length ? '.' : ', which is what this case expects.') + '</div></div>';
    html += '</div>';
    $("content").innerHTML = html;
    var go = function (j) { if (order[j]) { var keep = state.tab; select(order[j]); state.tab = keep; } };
    $("tcPrev").onclick = function () { go(k - 1); };
    $("tcNext").onclick = function () { go(k + 1); };
    if (g.nodes.length) wireGraph(id, g);
  }
  function tcRow(label, want, got, ok) {
    return '<tr><td>' + esc(label) + '</td><td class="mono">' + esc(want) + '</td><td class="mono" style="color:' + (ok ? "var(--pass)" : "var(--fail)") + ';font-weight:600">' + esc(got) + '</td><td>' + (ok ? '<span class="pill ok">✓</span>' : '<span class="pill no">✕</span>') + '</td></tr>';
  }
  function tcStats(s) {
    var items = [["Writes", s.writes], ["Tool calls", s.calls]];
    if ("moved" in s) items.push(["Orders moved", s.moved + "/" + s.expected_moves], ["Rescheduled", s.rescheduled], ["Transferred", s.transferred], ["Dealers", s.dealers], ["Loaners", s.loaners]);
    if (s.lots && s.lots.length) items.push(["Stop-sale VINs", s.stop_sale_vins], ["Owners", s.owners]);
    return items.map(function (x) { return '<div class="stat"><div class="n">' + esc(x[1]) + '</div><div class="l">' + x[0] + '</div></div>'; }).join("");
  }

  /* ---------- global ---------- */
  (function () { var t = store.get("theme", null); if (t) document.documentElement.dataset.theme = t; })();
  $("q").oninput = function (e) { state.q = e.target.value; renderSide(); };
  window.addEventListener("resize", function () { if (state.view === "events" && state.zoom == null && state.selected && $("nm")) drawGraph(state.selected); });
  document.addEventListener("keydown", function (e) {
    if ($("onto").open || state.view !== "events") return;
    if (e.target.tagName === "INPUT") { if (e.key === "Escape") e.target.blur(); return; }
    var list = visibleEvents(), i = list.findIndex(function (x) { return x.event_id === state.selected; });
    if (e.key === "ArrowDown" || e.key === "j") { if (i < list.length - 1) { select(list[i + 1].event_id); e.preventDefault(); } }
    else if (e.key === "ArrowUp" || e.key === "k") { if (i > 0) { select(list[i - 1].event_id); e.preventDefault(); } }
    else if (/^[1-7]$/.test(e.key) && state.selected) { var vis = (state.cases && state.cases.get(state.selected) ? TABS : TABS.slice(1)); if (vis[+e.key - 1]) setTab(vis[+e.key - 1]); }
    else if (e.key === "Escape" && state.focus != null) { state.focus = null; state.gq = ""; renderMain(); }
  });
  window.addEventListener("hashchange", function () {
    var h = new URLSearchParams(location.hash.slice(1));
    if (h.get("event") && state.events.some(function (e) { return e.event_id === h.get("event"); })) { openEvent(h.get("event")); return; }
    if (h.get("run") && h.get("run") !== state.run) { setRun(h.get("run")); return; }
    if (["dashboard","events","reports"].indexOf(h.get("view")) >= 0) setView(h.get("view"));
  });
  (function () {
    var h = new URLSearchParams(location.hash.slice(1));
    var v = h.get("event") ? "events" : (h.get("view") || store.get("view", "dashboard"));
    state.run = h.get("run") || store.get("run", null);
    if (/^tests\//.test(state.run || "") && !h.get("tab")) state.wantCaseTab = true;
    setView(["events","reports"].indexOf(v) >= 0 ? v : "dashboard", true);
  })();
  $("rcard").onclick = function () { setView("reports"); };
  loadReports(true);
  fetch("/api/tests", {method:"HEAD", cache:"no-store"}).then(function (r) { if (!r.ok) $("testsLink").hidden = true; }).catch(function () { $("testsLink").hidden = true; });
  load(null);
})();
</script>
</body>
</html>
