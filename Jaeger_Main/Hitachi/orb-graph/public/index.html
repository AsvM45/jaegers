<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orb graph</title>
<style>
  :root { --bg:#04050b; --ink:#dfe6ff; --dim:#8a93b8; --panel:rgba(12,14,28,.6); --line:rgba(255,255,255,.09); }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
    font:14px/1.45 "Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif; }
  canvas { display:block; }
  .panel { position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:14px;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); padding:14px 16px; }
  /* Title card: a small view label, the title, and the counts as two quiet figures. */
  #title { top:18px; left:18px; display:grid; gap:6px; min-width:196px; padding:12px 16px 12px 14px;
    background:linear-gradient(180deg, rgba(22,26,52,.78), rgba(12,14,30,.72)); border-color:rgba(130,150,255,.16);
    box-shadow:0 10px 30px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.05); }
  #title .kicker { display:flex; align-items:center; gap:8px; font-size:10.5px; font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; color:#93a4ff; }
  #title .kicker::before { content:""; width:7px; height:7px; border-radius:50%; background:#5b7cff; box-shadow:0 0 10px 2px rgba(91,124,255,.7); }
  #title .kicker:empty { display:none; }
  #title h1 { margin:0; font-size:16px; font-weight:650; letter-spacing:.005em; line-height:1.25; }
  #title p { margin:0; display:flex; gap:14px; color:var(--dim); font-size:12px; }
  #title p b { color:var(--ink); font-weight:650; font-variant-numeric:tabular-nums; margin-right:4px; }
  /* No records yet: the empty 3D space (grid floor, controls), no legend, until events arrive. */
  body.empty #legend, body.empty #info, body.empty #hint { display:none !important; }
  #mode { top:18px; left:50%; transform:translateX(-50%); display:flex; gap:2px; padding:4px; }
  #mode button { all:unset; cursor:pointer; padding:6px 18px; border-radius:10px; color:var(--dim); font-weight:600; }
  #mode button:hover { color:var(--ink); }
  #mode button[aria-pressed="true"] { background:rgba(255,255,255,.12); color:var(--ink); }
  #mode button:focus-visible { outline:2px solid #fff; outline-offset:-2px; }
  #zoom { right:18px; bottom:calc(18px + var(--inset, 0px)); display:flex; flex-direction:column; gap:2px; padding:4px; }
  #zoom button { all:unset; cursor:pointer; width:36px; height:36px; display:grid; place-items:center; border-radius:10px; color:var(--ink); }
  #zoom button:hover { background:rgba(255,255,255,.08); }
  #zoom button:focus-visible { outline:2px solid #fff; outline-offset:-2px; }
  #zoom svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  #legend { left:18px; bottom:18px; display:flex; flex-direction:column; gap:2px; padding:8px; }
  #legend button { all:unset; cursor:pointer; display:flex; align-items:center; gap:10px; padding:6px 10px;
    border-radius:8px; color:var(--ink); }
  #legend button:hover { background:rgba(255,255,255,.06); }
  #legend button:focus-visible { outline:2px solid #fff; outline-offset:-2px; }
  #legend button[aria-pressed="false"] { opacity:.38; }
  #legend .dot { width:11px; height:11px; border-radius:50%; background:var(--c); box-shadow:0 0 10px 2px var(--c); }
  #legend .n { margin-left:auto; padding-left:18px; color:var(--dim); font-variant-numeric:tabular-nums; }
  #info { top:18px; right:18px; width:260px; display:none; max-height:calc(100% - 36px); overflow:auto; }
  #info .more { padding:3px 4px; font-size:12.5px; color:var(--dim); }
  body.embed #info { width:230px; max-height:calc(100% - 90px); }
  #info h2 { margin:0 0 2px; font-size:18px; font-weight:600; }
  #info .type { display:flex; align-items:center; gap:8px; color:var(--dim); font-size:12.5px; margin-bottom:10px; }
  #info .dot { width:9px; height:9px; border-radius:50%; background:var(--c); box-shadow:0 0 8px 2px var(--c); }
  #info .detail { margin:-4px 0 10px; color:var(--ink); font-size:12.5px; }
  #info .chips { display:flex; flex-wrap:wrap; gap:6px; }
  #info .chips button { all:unset; cursor:pointer; padding:3px 10px; border-radius:99px; font-size:12.5px;
    border:1px solid var(--c); color:var(--ink); }
  #info .chips button:hover { background:color-mix(in srgb, var(--c) 28%, transparent); }
  #info .chips button:focus-visible { outline:2px solid #fff; }
  #hint { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); color:var(--dim); font-size:12.5px;
    pointer-events:none; text-align:center; padding:0 12px; }
  /* Loading: panels wait behind a spinner (standalone) or the dashboard's own loader (embedded). */
  .panel, #hint { transition:opacity .35s ease; }
  body.loading .panel, body.loading #hint { opacity:0; pointer-events:none; }
  #boot { position:fixed; inset:0; display:grid; place-items:center; pointer-events:none; transition:opacity .35s ease; }
  body:not(.loading) #boot, body.embed #boot { opacity:0; }
  #boot i { width:38px; height:38px; border-radius:50%; border:3px solid rgba(255,255,255,.1); border-top-color:#2b8cff; animation:orb-spin 1s linear infinite; }
  @keyframes orb-spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #boot i { animation:none; border-top-color:rgba(255,255,255,.1); border-color:#2b8cff; } .panel, #hint, #boot { transition:none; } }
  #err { position:fixed; inset:0; display:none; place-items:center; color:#ff8a8a; text-align:center; padding:24px; }
  /* The plain floor: the empty graph, and the stand-in when the browser takes the 3D view away. The same
     faint grid as the 3D floor, seen from above at an angle, fading out at its edges. */
  #floor { position:fixed; inset:0; display:none; perspective:900px; overflow:hidden; pointer-events:none; }
  #floor i { position:absolute; left:50%; top:62%; width:1600px; height:1600px; margin:-800px 0 0 -800px; transform:rotateX(60deg);
    background-image:linear-gradient(rgba(42,51,88,.75) 1px, transparent 1px), linear-gradient(90deg, rgba(42,51,88,.75) 1px, transparent 1px);
    background-size:57px 57px; background-position:center;
    -webkit-mask-image:radial-gradient(closest-side, #000 55%, transparent); mask-image:radial-gradient(closest-side, #000 55%, transparent); }
  body.floor #floor { display:block; }
  body.floor canvas, body.floor #mode, body.floor #zoom, body.floor #hint { visibility:hidden; }
  #lost { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); font-size:13px; color:#c7d2ff; }
  #lost[hidden] { display:none; }
  #lost button { margin-left:8px; padding:4px 12px; border-radius:8px; border:1px solid rgba(255,255,255,.2); background:transparent; color:#fff; font:inherit; cursor:pointer; }
  body.embed #hint { display:none; }
  body.embed .panel { padding:10px 12px; }
  body.embed #title h1 { font-size:15px; }
  body.embed #title { padding:10px 14px 10px 12px; }
  /* Sizing: the overlays fit whatever space the graph gets, so nothing covers anything else. */
  #title { max-width:min(360px, calc(100% - 36px)); }
  #title h1 { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #legend { max-height:calc(100% - 150px); overflow-y:auto; overscroll-behavior:contain; }   /* never up into the title card */
  #legend button { white-space:nowrap; }
  /* Shorter graph: the legend goes to two columns and everything tightens. */
  @media (max-height:720px) {
    #legend { display:grid; grid-template-columns:repeat(2, minmax(0, auto)); column-gap:4px; }
    #legend button { padding:4px 8px; font-size:12.5px; gap:8px; }
    #legend .n { padding-left:10px; }
    .panel { padding:10px 12px; }
    #title { gap:4px; } #title h1 { font-size:14.5px; }
    #zoom button { width:32px; height:32px; }
  }
  @media (max-height:480px) {
    #legend { grid-template-columns:repeat(3, minmax(0, auto)); }
    #legend .n { display:none; }
    #title p { display:none; }
  }
  /* Narrower graph: the 2D/3D switch moves to the right so it never meets the title card. */
  @media (max-width:900px) { #mode { left:auto; right:18px; transform:none; } }
  @media (max-width:640px) { #zoom { bottom:auto; top:76px; } #mode { left:auto; right:18px; transform:none; } #info { width:auto; left:18px; top:auto; bottom:18px; right:18px; } #legend { display:none; } #hint { display:none; } }
</style>
</head>
<body class="loading">
  <div id="boot" aria-hidden="true"><i></i></div>
  <div id="title" class="panel"><span class="kicker" id="kicker"></span><h1>Orb Graph</h1><p id="stats">&nbsp;</p></div>
  <div id="mode" class="panel" role="group" aria-label="View mode"><button data-mode="2d" aria-pressed="false">2D</button><button data-mode="3d" aria-pressed="true">3D</button></div>
  <div id="zoom" class="panel" role="group" aria-label="Zoom">
    <button id="zoom-in" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 18 18"><path d="M9 3v12M3 9h12"/></svg></button>
    <button id="zoom-out" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 18 18"><path d="M3 9h12"/></svg></button>
    <button id="zoom-fit" aria-label="Zoom to fit all nodes" title="Zoom to fit all nodes"><svg viewBox="0 0 18 18"><path d="M3 7V3h4M11 3h4v4M15 11v4h-4M7 15H3v-4"/></svg></button>
  </div>
  <div id="legend" class="panel" aria-label="Node types"></div>
  <div id="info" class="panel" aria-live="polite"></div>
  <div id="hint">Drag an orb to move it. Click to focus its links. Drag empty space to orbit. Scroll or use the buttons to zoom.</div>
  <div id="floor" aria-hidden="true"><i></i></div>
  <div id="lost" class="panel" hidden>The browser paused this graph: too many 3D views are open. <button type="button">Reload</button></div>
  <div id="err"></div>
  <script>
    // If the graph cannot start at all (no WebGL, a script error before its own error handling), say
    // so at once: show the error and tell the dashboard, instead of leaving its loader up.
    window.addEventListener('error', function (e) {
      document.body.classList.remove('loading');
      var box = document.getElementById('err');
      if (box && !box.textContent) { box.style.display = 'grid'; box.textContent = 'Could not start the graph: ' + (e.message || 'unknown error') + '. This view needs WebGL.'; }
      if (window.parent !== window) window.parent.postMessage({ source: 'orb', type: 'error' }, location.origin);
    });
  </script>
  <script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
