# Multi-task Lakeflow DAG for JAEGERS House Edge.
# All tasks use a shared serverless Python environment.
# No schedule is configured: runs must be started manually.
resources:
  jobs:
    house_edge_medallion_pipeline:
      name: "[${bundle.target}] JAEGERS House Edge Medallion Pipeline"
      description: "Automated Medallion ingestion, domain validation, past-only feature calculation, parity verification, and MLflow model tracking"
      max_concurrent_runs: 1
      timeout_seconds: 1800

      parameters:
        - name: catalog
          default: "${var.catalog}"
        - name: schema
          default: "${var.schema}"
        - name: data_dir
          default: "${var.data_dir}"

      environments:
        - environment_key: default
          spec:
            environment_version: "2"

      tasks:
        - task_key: bronze_ingest
          environment_key: default
          max_retries: 0
          timeout_seconds: 600
          description: "Ingests raw query and spin history files into Bronze Delta tables with SHA-256 lineage tracking"
          spark_python_task:
            python_file: ../src/bronze.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              - "--data-dir"
              - "${var.data_dir}"

        - task_key: silver_clean_and_validate
          environment_key: default
          max_retries: 0
          timeout_seconds: 600
          depends_on:
            - task_key: bronze_ingest
          description: "Validates domain quality constraints, maps payout indices, deduplicates spins, and creates episode summaries"
          spark_python_task:
            python_file: ../src/silver.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"

        - task_key: gold_asof_features
          environment_key: default
          max_retries: 0
          timeout_seconds: 600
          depends_on:
            - task_key: silver_clean_and_validate
          description: "Generates 471-dimensional Gold feature vectors enforcing strict tick < cutoff temporal isolation"
          spark_python_task:
            python_file: ../src/gold.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"

        - task_key: verify_feature_parity
          environment_key: default
          max_retries: 0
          timeout_seconds: 600
          depends_on:
            - task_key: gold_asof_features
          description: "Executes mathematical feature parity audit comparing PySpark Gold features against local research features"
          spark_python_task:
            python_file: ../src/parity.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"

        - task_key: mlflow_track_models
          environment_key: default
          max_retries: 0
          timeout_seconds: 600
          depends_on:
            - task_key: verify_feature_parity
          description: "Logs model metrics, calibration, and provenance to MLflow; real-data provenance must be independently verified"
          spark_python_task:
            python_file: ../src/mlflow_tracking.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"

        - task_key: refresh_monitoring_views
          environment_key: default
          max_retries: 0
          timeout_seconds: 600
          depends_on:
            - task_key: mlflow_track_models
          description: "Refreshes analytical monitoring views and calibration metrics for reporting"
          spark_python_task:
            python_file: ../src/silver.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              - "--action"
              - "refresh_views"
