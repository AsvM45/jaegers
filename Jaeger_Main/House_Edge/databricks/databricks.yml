# JAEGERS House Edge: Databricks Declarative Automation Bundle
# AWS development workspace: previously verified catalog workspace, schema house_edge.
# This YAML describes resources; it does not itself execute any compute.
bundle:
  name: jaegers-house-edge

include:
  - resources/*.job.yml

variables:
  catalog:
    description: "Unity Catalog catalog name"
    default: "jaegers_dev"
  schema:
    description: "Unity Catalog schema name"
    default: "house_edge"
  data_dir:
    description: "Root directory containing raw House Edge CSV splits"
    default: "public"
  pipeline_mode:
    description: "Execution mode for Lakehouse pipeline (batch/continuous)"
    default: "batch"

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/dev
    variables:
      catalog: workspace
      schema: house_edge
      data_dir: /Volumes/workspace/house_edge/raw_data/public
      pipeline_mode: batch

  prod:
    mode: production
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/prod
    variables:
      catalog: jaegers_prod
      schema: house_edge
      pipeline_mode: batch
